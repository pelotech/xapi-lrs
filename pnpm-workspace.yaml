overrides:
  # Every comment in this file is deliberately INSIDE a mapping, never above
  # the first key. Renovate bumps the pins below, and its YAML writeback
  # stringifies only the document's contents node — so a comment in the
  # document prelude (above the first key) is silently dropped on the first
  # bump. Keep new notes indented under a key or they will not survive.
  #
  # This file exists because pnpm 11 no longer reads the `pnpm` field in
  # package.json; it is pnpm's settings file now (https://pnpm.io/settings).
  # It is not a workspace definition — this repo is a single package, and
  # `packages:` is intentionally absent.
  #
  # These overrides pin two transitive dependencies of the ADL conformance
  # suite to forks carrying fixes the upstream packages never released.
  # Dropping them breaks `pnpm test:conformance`, and pnpm applies overrides
  # silently when they sit somewhere it no longer reads — so they live here,
  # not in package.json.
  #
  # ---------------------------------------------------------------------------
  # DO NOT RUBBER-STAMP A DIGEST BUMP HERE. Inspect every proposed update.
  # ---------------------------------------------------------------------------
  # These are not maintained dependencies. Both are personal forks under a
  # third-party account with 0 stars, last pushed January 2017, sitting ~278
  # commits behind a healthy upstream (forwardemail/supertest, 14k stars, still
  # released). Their entire substantive delta is ~36 lines in lib/test.js: a
  # debug logger that serialises each request/response through
  # process.postMessage so the ADL runner can print HTTP traffic. Benign, never
  # upstreamed, and now load-bearing for the official conformance battery.
  #
  # The structural risk is the account, not the code. A takeover, force-push or
  # revived branch changes what these SHAs' sibling refs point at, and Renovate
  # will offer it as a routine "digest update". Both PRs it opened in Aug 2026
  # were rejected on inspection, and neither was a normal upgrade:
  #
  #   * supertest (#90) proposed moving BACKWARDS — the pin tracks the `ipc`
  #     branch, Renovate followed the stale `master` HEAD, and the "update" was
  #     four months older, silently dropping a "try to avoid crash" commit.
  #   * super-request (#87) broke all eight conformance cells: 0 of 1364 tests
  #     executed, i.e. the battery failed to start at all.
  #
  # So: read the fork's diff and the branch it came from before merging any bump
  # here, and confirm the conformance matrix is green — those tests are the only
  # thing that exercises this code. Closing a bad PR is the right move; Renovate
  # will not re-propose an unchanged digest.
  #
  # The durable fixes, in preference order: get the logger upstreamed (or
  # replaced with a superagent plugin) so the forks can go entirely; failing
  # that, mirror both forks into this org so a third-party account cannot move
  # them underneath us.
  adl-lrs-conformance-tests>super-request: github:rchadwic/super-request#1c8e002a3babd42b59938b4e60474cfb8886130b
  adl-lrs-conformance-tests>supertest: github:rchadwic/supertest#2a2346bc82d3c7233d363c265c5bf3b1be6ee5b2

# Required by the two overrides above, which are exactly what this setting
# blocks: a transitive dependency resolved from git rather than the registry.
# With it left at its default of true, any FRESH resolution fails with
# ERR_PNPM_EXOTIC_SUBDEP — `pnpm install` after a dependency change, Renovate
# regenerating the lockfile, lockfile maintenance. Installs that resolve purely
# from the lockfile skip the check, which is why `--frozen-lockfile` in CI kept
# passing and this only surfaced on a bump.
#
# pnpm offers no per-package allowlist — it is one global boolean — so this
# does give up the guard for the whole tree, not just these two packages.
# Accepted because the exposure is narrow and already deliberate: both are
# dev-only test tooling pinned to immutable commit SHAs and tracked by
# Renovate, so neither can change content without a reviewed PR. Removing the
# need for this means retiring the forks (upstream releasing the fixes, or
# vendoring them), at which point delete this setting rather than keep it.
blockExoticSubdeps: false

# pnpm 11 requires an explicit decision on every dependency lifecycle script.
# esbuild is no longer in the tree at all — it was only ever pulled in as a
# satisfied optional peer of vite alongside tsx, and vite 8 bundles rolldown
# instead. The entry is kept as a standing decision so that if some dependency
# reintroduces esbuild, install does not stop to ask: denying the build changes
# nothing at runtime (esbuild ships its platform binary as an optional
# dependency rather than fetching it in a postinstall).
allowBuilds:
  esbuild: false
