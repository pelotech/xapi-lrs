# pnpm settings. Not a workspace definition — this repo is a single package,
# but from pnpm 11 the `pnpm` field in package.json is ignored and this file is
# where pnpm reads its settings from (https://pnpm.io/settings).

# These overrides pin two transitive dependencies of the ADL conformance suite
# to forks carrying fixes the upstream packages never released. Dropping them
# breaks `pnpm test:conformance`, and pnpm applies overrides silently when they
# are in a place it no longer reads — so they live here, not in package.json.
overrides:
  adl-lrs-conformance-tests>super-request: github:rchadwic/super-request#1c8e002a3babd42b59938b4e60474cfb8886130b
  adl-lrs-conformance-tests>supertest: github:rchadwic/supertest#2a2346bc82d3c7233d363c265c5bf3b1be6ee5b2

# pnpm 11 requires an explicit decision on every dependency lifecycle script.
# esbuild (via vitest) is denied: pnpm 10 already ignored this build and the
# full suite passed, because esbuild ships its platform binary as an optional
# dependency rather than fetching it in the postinstall. Keeping it off changes
# nothing at runtime and keeps install from executing third-party scripts.
allowBuilds:
  esbuild: false
